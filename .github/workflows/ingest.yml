name: Ingest

on:
  schedule:
    - cron: "0 13 16 * *"
  workflow_dispatch:
    inputs:
      fund:
        description: "CIK of a single fund (optional; all funds if empty)"
        required: false
        type: string
      dry_run:
        description: "Dry run (reads only; no Firestore, securities-cache, or GCS writes)"
        required: false
        type: boolean
        default: false
      refresh:
        description: "Rebuild securities/ cache entries (run after a sector or ticker rule changes)"
        required: false
        type: choice
        options: [none, unknown, all]
        default: none

permissions:
  contents: write

concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ingest/requirements.txt

      - run: python -m pytest -q
        working-directory: ingest

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Run ingest
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          FUND: ${{ github.event.inputs.fund }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          args=()
          if [ -n "$FUND" ]; then args+=(--fund "$FUND"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$REFRESH" ]; then args+=(--refresh "$REFRESH"); fi
          python ingest/ingest.py "${args[@]}"

      - name: Commit keepalive marker
        run: |
          if [ ! -f data/last_ingest.json ]; then
            echo "No data/last_ingest.json written (dry run); skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_ingest.json
          if git diff --cached --quiet; then
            echo "data/last_ingest.json unchanged; skipping commit."
            exit 0
          fi
          period=$(python -c "import json; print(json.load(open('data/last_ingest.json'))['period'])")
          git commit -m "chore: ingest $period"
          # Anything pushed to main while the run was in flight rejects this push and fails a
          # job whose real work already succeeded. The marker only has to land eventually.
          git pull --rebase
          git push
