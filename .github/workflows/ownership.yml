name: Ownership

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Firestore/GCS writes)"
        required: false
        type: boolean
        default: false
      since:
        description: "Start date YYYY-MM-DD (optional; defaults from GCS state)"
        required: false
        type: string
      until:
        description: "End date YYYY-MM-DD (optional; defaults to today)"
        required: false
        type: string
      rebuild:
        description: "Rebuild every issuer/investor doc, not just touched ones"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency: ownership

jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ingest/requirements.txt

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$SA_JSON" > "$RUNNER_TEMP/sa.json"

      - name: Run ownership ingest
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SINCE: ${{ github.event.inputs.since }}
          UNTIL: ${{ github.event.inputs.until }}
          REBUILD: ${{ github.event.inputs.rebuild }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$UNTIL" ]; then args+=(--until "$UNTIL"); fi
          if [ "$REBUILD" = "true" ]; then args+=(--rebuild); fi
          python ingest/ownership.py "${args[@]}"
